services:
  orders-api:
    build:
      context: ./backend
      dockerfile: OrderFlow.Api/Dockerfile
    ports:
      - "8080:8080"

  inventory-worker:
    build:
      context: ./backend
      dockerfile: OrderFlow.InventoryWorker/Dockerfile

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - orders-api